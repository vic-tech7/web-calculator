<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VEC Scientific Web Calculator</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- HISTORY PANEL -->
<div id="history-panel" class="history-panel">
    <div class="history-header">
        <h2>Calculation History</h2>
        <button onclick="clearHistoryUI()">Clear</button>
        <button onclick="toggleHistoryPanel()">Back</button>
    </div>

    <ul id="history-list"></ul>

    <div class="utility-section">
        <h3>Utilities</h3>
        <button class="util-btn" onclick="openUnitConverter()">Unit Converter</button>
        <button class="util-btn" onclick="openProgrammerMode()">Programmer Mode</button>
        <button class="util-btn" onclick="openAISecurityAssistant()">AI Assistant</button>
        <button class="util-btn" onclick="changeBackground()">Dynamic Wallpaper</button>
        <button class="util-btn" onclick="openContactPage()">Contact CHAD FDEV</button>
        <button class="util-btn" onclick="window.open('https://github.com/vic-tech7')">My GitHub</button>
        <button class="util-btn" onclick="window.location.reload()">Refresh App</button>
        <button class="util-btn" onclick="window.print()">Save as PDF</button>
        <button class="util-btn" onclick="alert('Dark mode already active 😎')">Theme Mode</button>
    </div>
</div>


<div class="main-content">

    <button id="menu-button" onclick="toggleHistoryPanel()">☰</button>

    <header>
        <h1>VEC Scientific Web Calculator</h1>
        <p>Now SCIENTIFIC + AI</p>
        <p><em>Created by CHAD FDEV</em></p>
    </header>

    <div class="calculator">
        <input type="text" id="display" disabled>

        <div class="buttons">
            <button onclick="clearDisplay()">AC</button>
            <button onclick="deleteLast()">⌫</button>
            <button onclick="appendToDisplay('/')">÷</button>
            <button onclick="appendToDisplay('*')">×</button>

            <button onclick="appendToDisplay('7')">7</button>
            <button onclick="appendToDisplay('8')">8</button>
            <button onclick="appendToDisplay('9')">9</button>
            <button onclick="appendToDisplay('-')">-</button>

            <button onclick="appendToDisplay('4')">4</button>
            <button onclick="appendToDisplay('5')">5</button>
            <button onclick="appendToDisplay('6')">6</button>
            <button onclick="appendToDisplay('+')">+</button>

            <button onclick="appendToDisplay('1')">1</button>
            <button onclick="appendToDisplay('2')">2</button>
            <button onclick="appendToDisplay('3')">3</button>
            <button onclick="calculate()">=</button>

            <button onclick="appendToDisplay('0')">0</button>
            <button onclick="appendToDisplay('.')">.</button>
            <button onclick="calculateAdvanced('sqrt')">√</button>
            <button onclick="calculateAdvanced('sin')">sin</button>

            <button onclick="calculateAdvanced('cos')">cos</button>
            <button onclick="calculateAdvanced('tan')">tan</button>
            <button onclick="calculateAdvanced('log')">log</button>
            <button onclick="calculateAdvanced('square')">x²</button>

            <button onclick="calculateAdvanced('fact')">x!</button>
            <button onclick="calculateAdvanced('pi')">π</button>
            <button onclick="calculateAdvanced('e')">e</button>
            <button onclick="calculateAdvanced('percent')">%</button>
        </div>
    </div>
</div>


<!-- AI WINDOW -->
<div id="ai-chat-overlay" class="ai-window">
    <div id="ai-box" class="ai-box">

        <div id="drag-bar">
    <span>VEC AI Assistant</span>

    <div>
        <button id="drag-move-btn">MOVE</button>
        <button onclick="closeAIChat()" id="close-ai-btn">✖</button>
    </div>
</div>
        <div id="ai-chat-messages"></div>

        <textarea id="ai-user-input" placeholder="Ask anything..."></textarea>

        <button onclick="sendAIQuery()">Send</button>
        <button onclick="generateImage()">Create Image</button>
        <button onclick="editImage()">Edit Image</button>

        <button onclick="insertPrompt('Write HTML code for ')">HTML</button>
        <button onclick="insertPrompt('Write CSS code for ')">CSS</button>
        <button onclick="insertPrompt('Write JavaScript code for ')">JS</button>

        <button onclick="clearAIChat()">Clear Chat</button>

    </div>
</div>

<!-- CONTACT -->
<div id="contact-overlay" class="overlay">
    <div class="overlay-content">
        <h2>Contact CHAD FDEV</h2>

        <a href="https://wa.me/34604157842" target="_blank">
            <button>WhatsApp</button>
        </a>

        <a href="mailto:vectordevtech@gmail.com">
            <button>Email</button>
        </a>

        <a href="https://github.com/vic-tech7" target="_blank">
            <button>GitHub</button>
        </a>

        <button onclick="closeContactPage()">Close</button>
    </div>
</div>

<footer>© CHAD FDEV</footer>

<script src="script.js"></script>
</body>
</html>
